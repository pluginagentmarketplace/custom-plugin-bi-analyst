# Frontend Development Configuration Template
# BI Analyst Plugin - Frontend Skill
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "spa"  # spa, mpa, ssr, ssg
  framework: "react"  # react, vue, angular, svelte

# Build Configuration
build:
  output_dir: "dist"
  source_dir: "src"
  public_dir: "public"
  assets_dir: "assets"

# Component Architecture
components:
  naming_convention: "PascalCase"
  style_approach: "css-modules"  # css-modules, styled-components, tailwind
  state_management: "zustand"  # redux, zustand, context, recoil

  structure:
    atomic_design: true
    levels:
      - atoms
      - molecules
      - organisms
      - templates
      - pages

# TypeScript Configuration
typescript:
  enabled: true
  strict: true
  paths:
    "@components/*": ["src/components/*"]
    "@hooks/*": ["src/hooks/*"]
    "@utils/*": ["src/utils/*"]
    "@services/*": ["src/services/*"]
    "@types/*": ["src/types/*"]

# Testing Configuration
testing:
  framework: "vitest"  # jest, vitest
  coverage_threshold: 80
  e2e_framework: "playwright"  # cypress, playwright

  patterns:
    unit: "**/*.test.{ts,tsx}"
    integration: "**/*.integration.test.{ts,tsx}"
    e2e: "e2e/**/*.spec.ts"

# Performance Optimization
performance:
  code_splitting: true
  lazy_loading: true
  prefetch_routes: true

  bundle_analysis:
    enabled: true
    max_bundle_size_kb: 500

  image_optimization:
    formats: ["webp", "avif"]
    lazy_load: true
    placeholder: "blur"

# Accessibility Standards
accessibility:
  wcag_level: "AA"  # A, AA, AAA
  aria_required: true
  semantic_html: true
  keyboard_navigation: true
  screen_reader_testing: true

# Internationalization
i18n:
  enabled: false
  default_locale: "en"
  supported_locales:
    - en
    - tr
  fallback_locale: "en"

# API Integration
api:
  base_url: "${API_BASE_URL}"
  timeout_ms: 30000
  retry_attempts: 3

  data_fetching:
    library: "tanstack-query"  # axios, fetch, tanstack-query
    cache_time_ms: 300000
    stale_time_ms: 60000

# Development Tools
dev_tools:
  hot_reload: true
  source_maps: true
  error_overlay: true

  linting:
    eslint: true
    prettier: true
    stylelint: true

  browser_support:
    modern_only: true
    targets: ">0.2%, not dead"
