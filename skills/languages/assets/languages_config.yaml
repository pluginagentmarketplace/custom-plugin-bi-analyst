# Programming Languages Configuration Template
# BI Analyst Plugin - Languages Skill
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  primary_language: "python"
  version: "3.11"

# Python Configuration
python:
  version: "3.11"

  package_manager: "uv"  # uv, pip, poetry, pdm
  virtual_env: true

  linting:
    tools:
      - ruff
      - mypy
    config:
      ruff:
        line-length: 100
        select: ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
      mypy:
        strict: true
        ignore_missing_imports: true

  formatting:
    tool: "ruff"  # ruff, black
    line_length: 100
    quote_style: "double"

  testing:
    framework: "pytest"
    coverage_threshold: 80
    plugins:
      - pytest-cov
      - pytest-asyncio
      - pytest-mock

  type_checking:
    enabled: true
    strict: true
    tool: "mypy"

# Go Configuration
go:
  version: "1.21"

  modules: true
  proxy: "https://proxy.golang.org"

  linting:
    tools:
      - golangci-lint
    config:
      enable:
        - govet
        - errcheck
        - staticcheck
        - gosimple
        - ineffassign

  testing:
    coverage_threshold: 80
    race_detection: true
    benchmark: true

# Rust Configuration
rust:
  edition: "2021"
  channel: "stable"

  cargo:
    features: []
    default_features: true

  clippy:
    enabled: true
    deny:
      - warnings
      - clippy::all
    warn:
      - clippy::pedantic

  testing:
    doc_tests: true
    integration_tests: true

# JavaScript/TypeScript Configuration
javascript:
  runtime: "node"
  version: "20"

  typescript:
    enabled: true
    strict: true
    target: "ES2022"
    module: "ESNext"

  package_manager: "pnpm"  # npm, yarn, pnpm, bun

  linting:
    eslint:
      extends:
        - eslint:recommended
        - plugin:@typescript-eslint/recommended
      rules:
        no-unused-vars: error
        no-console: warn

  formatting:
    prettier:
      semi: true
      singleQuote: true
      tabWidth: 2

# Java Configuration
java:
  version: "21"
  build_tool: "gradle"  # maven, gradle

  code_style: "google"  # google, sun, custom

  testing:
    framework: "junit5"
    mocking: "mockito"

  static_analysis:
    tools:
      - checkstyle
      - spotbugs
      - pmd

# C++ Configuration
cpp:
  standard: "c++20"
  compiler: "gcc"  # gcc, clang, msvc

  build_system: "cmake"

  static_analysis:
    tools:
      - clang-tidy
      - cppcheck

  formatting:
    tool: "clang-format"
    style: "Google"

# Code Quality Standards
quality:
  documentation:
    required: true
    format: "docstring"  # docstring, jsdoc, rustdoc

  complexity:
    max_cyclomatic: 10
    max_cognitive: 15
    max_function_length: 50

  naming_conventions:
    variables: "snake_case"  # Python, Rust
    functions: "snake_case"
    classes: "PascalCase"
    constants: "SCREAMING_SNAKE_CASE"

  security:
    bandit_enabled: true  # Python
    semgrep_enabled: true
    dependency_audit: true

# Multi-Language Project
polyglot:
  enabled: false
  languages:
    - python
    - typescript
  shared:
    api_contracts: "openapi"
    data_models: "protobuf"
