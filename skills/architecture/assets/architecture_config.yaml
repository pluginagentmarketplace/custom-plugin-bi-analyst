# System Architecture Configuration Template
# BI Analyst Plugin - Architecture Skill
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "microservices"  # monolith, microservices, serverless, modular-monolith

# Architecture Style
architecture:
  style: "microservices"
  communication: "async"  # sync, async, hybrid

  patterns:
    - event-driven
    - cqrs
    - saga

  principles:
    - separation-of-concerns
    - single-responsibility
    - dependency-inversion
    - interface-segregation

# Service Design
services:
  naming_convention: "${domain}-service"

  default_stack:
    language: "python"
    framework: "fastapi"
    database: "postgresql"
    cache: "redis"
    messaging: "rabbitmq"

  templates:
    - type: "api-service"
      ports:
        http: 8000
        grpc: 50051
        metrics: 9090

    - type: "worker-service"
      ports:
        metrics: 9090

    - type: "gateway"
      ports:
        http: 80
        https: 443

# API Design
api:
  style: "rest"  # rest, graphql, grpc
  version_strategy: "url"  # url, header, query

  rest:
    naming: "kebab-case"
    versioning: "/api/v{version}"
    pagination:
      style: "cursor"  # offset, cursor, keyset
      default_limit: 20
      max_limit: 100

  graphql:
    schema_first: true
    federation: false

  grpc:
    proto_path: "proto/"
    generate_gateway: true

# Data Architecture
data:
  storage:
    primary: "postgresql"
    document: "mongodb"
    cache: "redis"
    search: "elasticsearch"
    object: "s3"

  patterns:
    - name: "event-sourcing"
      enabled: false
    - name: "cqrs"
      enabled: true
      read_model: "elasticsearch"
      write_model: "postgresql"

  replication:
    strategy: "async"
    read_replicas: 2

  partitioning:
    strategy: "range"  # hash, range, list
    key: "created_at"

# Messaging & Events
messaging:
  broker: "rabbitmq"  # rabbitmq, kafka, nats

  patterns:
    - pub-sub
    - request-reply
    - saga-orchestration

  event_schema:
    format: "avro"  # json, avro, protobuf
    registry: true
    versioning: true

  dead_letter:
    enabled: true
    max_retries: 3
    retry_delay_ms: 1000

# Scalability
scalability:
  horizontal:
    enabled: true
    min_instances: 2
    max_instances: 20
    target_cpu: 70
    target_memory: 80

  caching:
    strategy: "cache-aside"  # cache-aside, read-through, write-through
    ttl_seconds: 3600
    invalidation: "event-based"

  load_balancing:
    algorithm: "round-robin"  # round-robin, least-connections, ip-hash
    health_check:
      interval: 10
      timeout: 5
      threshold: 3

# Resilience
resilience:
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 30
    half_open_requests: 3

  retry:
    enabled: true
    max_attempts: 3
    backoff: "exponential"
    base_delay_ms: 100

  rate_limiting:
    enabled: true
    requests_per_second: 100
    burst_size: 20

  timeout:
    default_ms: 30000
    connect_ms: 5000
    read_ms: 30000

# Security Architecture
security:
  authentication:
    provider: "oauth2"  # jwt, oauth2, saml
    identity_provider: "keycloak"

  authorization:
    model: "rbac"  # rbac, abac, pbac
    policy_engine: "opa"

  encryption:
    at_rest: true
    in_transit: true
    algorithm: "aes-256-gcm"

  secrets:
    provider: "vault"
    rotation: true
    rotation_days: 90

# Observability
observability:
  logging:
    format: "json"
    level: "info"
    aggregation: "loki"

  metrics:
    provider: "prometheus"
    scrape_interval: 15
    retention_days: 30

  tracing:
    provider: "jaeger"
    sampling_rate: 0.1

  alerting:
    provider: "alertmanager"
    notification_channels:
      - slack
      - pagerduty

# Documentation
documentation:
  api:
    openapi: true
    asyncapi: true

  architecture:
    c4_model: true
    adr: true  # Architecture Decision Records

  diagrams:
    tool: "mermaid"
    auto_generate: true
