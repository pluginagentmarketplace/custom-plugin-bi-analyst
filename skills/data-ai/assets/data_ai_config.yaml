# Data Science & AI Configuration Template
# BI Analyst Plugin - Data-AI Skill
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "ml-pipeline"  # ml-pipeline, data-analysis, deep-learning, nlp, cv

# Data Configuration
data:
  storage:
    type: "s3"  # local, s3, gcs, azure
    bucket: "${DATA_BUCKET}"
    prefix: "datasets/"

  formats:
    tabular: ["csv", "parquet", "feather"]
    images: ["png", "jpg", "webp"]
    text: ["json", "jsonl", "txt"]

  versioning:
    enabled: true
    tool: "dvc"  # dvc, delta-lake, lakeFS

# Feature Engineering
features:
  store:
    enabled: true
    backend: "feast"  # feast, tecton, vertex-ai

  preprocessing:
    missing_values:
      strategy: "median"  # mean, median, mode, drop, constant
    scaling:
      method: "standard"  # standard, minmax, robust
    encoding:
      categorical: "onehot"  # onehot, label, target

  selection:
    methods:
      - mutual_information
      - feature_importance
      - correlation_threshold

# Model Training
training:
  framework: "pytorch"  # pytorch, tensorflow, sklearn, xgboost

  experiment_tracking:
    tool: "mlflow"  # mlflow, wandb, neptune, tensorboard
    tracking_uri: "${MLFLOW_TRACKING_URI}"
    experiment_name: "${PROJECT_NAME}"

  hyperparameter_tuning:
    enabled: true
    tool: "optuna"  # optuna, ray-tune, hyperopt
    n_trials: 100
    optimization_direction: "maximize"
    metric: "f1_score"

  cross_validation:
    method: "stratified_kfold"
    n_splits: 5
    shuffle: true

  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001

  checkpointing:
    save_best_only: true
    monitor: "val_loss"

# Deep Learning
deep_learning:
  hardware:
    device: "auto"  # cpu, cuda, mps, auto
    mixed_precision: true
    distributed: false

  training:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
    optimizer: "adamw"
    scheduler: "cosine_annealing"
    gradient_clipping: 1.0

  architectures:
    nlp:
      - transformer
      - bert
      - gpt
    cv:
      - resnet
      - efficientnet
      - vit

# MLOps
mlops:
  model_registry:
    enabled: true
    backend: "mlflow"

  deployment:
    format: "onnx"  # onnx, torchscript, tflite
    serving: "triton"  # triton, tensorflow-serving, torchserve

  monitoring:
    data_drift: true
    model_performance: true
    prediction_logging: true

  retraining:
    trigger: "drift_detected"  # scheduled, drift_detected, manual
    schedule: "0 0 * * 0"  # Weekly

# Evaluation
evaluation:
  classification:
    metrics:
      - accuracy
      - precision
      - recall
      - f1_score
      - roc_auc
    report:
      - confusion_matrix
      - classification_report
      - roc_curve

  regression:
    metrics:
      - mse
      - rmse
      - mae
      - r2_score

  thresholds:
    minimum_accuracy: 0.85
    minimum_f1: 0.80
    maximum_inference_time_ms: 100

# AI/LLM Integration
llm:
  provider: "openai"  # openai, anthropic, huggingface
  model: "gpt-4"

  prompt_engineering:
    templates_dir: "prompts/"
    version_control: true

  rag:
    enabled: false
    vector_store: "chroma"  # chroma, pinecone, weaviate
    embedding_model: "text-embedding-3-small"
    chunk_size: 500
    chunk_overlap: 50

  agents:
    enabled: false
    framework: "langchain"  # langchain, autogen, crewai

# Reproducibility
reproducibility:
  seed: 42
  deterministic: true
  log_environment: true
  save_config: true
