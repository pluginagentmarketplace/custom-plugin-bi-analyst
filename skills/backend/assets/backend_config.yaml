# Backend Development Configuration Template
# BI Analyst Plugin - Backend Skill
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  type: "api"  # api, microservice, monolith, serverless
  framework: "fastapi"  # fastapi, django, flask, express, spring

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true  # Development only
  log_level: "info"

# Database Configuration
database:
  type: "postgresql"  # postgresql, mysql, mongodb, sqlite
  host: "${DB_HOST:-localhost}"
  port: 5432
  name: "${DB_NAME}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"

  connection_pool:
    min_size: 5
    max_size: 20
    max_overflow: 10
    pool_timeout: 30

  migrations:
    tool: "alembic"
    auto_migrate: false

# API Configuration
api:
  version: "v1"
  prefix: "/api/v1"

  pagination:
    default_limit: 20
    max_limit: 100

  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst_limit: 20

  cors:
    enabled: true
    origins:
      - "http://localhost:3000"
      - "${FRONTEND_URL}"
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
    allow_credentials: true

# Authentication & Security
auth:
  type: "jwt"  # jwt, oauth2, api_key, session

  jwt:
    secret_key: "${JWT_SECRET_KEY}"
    algorithm: "HS256"
    access_token_expire_minutes: 30
    refresh_token_expire_days: 7

  password:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_digit: true
    require_special: true
    hashing_algorithm: "bcrypt"

# Caching
cache:
  enabled: true
  backend: "redis"
  url: "${REDIS_URL:-redis://localhost:6379/0}"
  default_ttl: 3600

  patterns:
    - key: "user:*"
      ttl: 1800
    - key: "config:*"
      ttl: 86400

# Logging & Monitoring
logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "json"
  include_request_id: true

  handlers:
    - type: "console"
      level: "DEBUG"
    - type: "file"
      path: "logs/app.log"
      rotation: "1 day"
      retention: "30 days"

monitoring:
  metrics:
    enabled: true
    endpoint: "/metrics"

  health_check:
    endpoint: "/health"
    include_db: true
    include_cache: true

  tracing:
    enabled: true
    service_name: "${PROJECT_NAME}"
    exporter: "otlp"

# Background Tasks
background_tasks:
  enabled: true
  broker: "redis"
  backend: "redis"

  queues:
    - name: "default"
      priority: "medium"
    - name: "high_priority"
      priority: "high"
    - name: "scheduled"
      priority: "low"

# File Storage
storage:
  provider: "s3"  # local, s3, gcs, azure
  bucket: "${S3_BUCKET}"
  region: "${AWS_REGION:-us-east-1}"

  uploads:
    max_size_mb: 10
    allowed_types:
      - "image/jpeg"
      - "image/png"
      - "application/pdf"

# Testing
testing:
  database:
    use_test_db: true
    test_db_prefix: "test_"

  fixtures:
    auto_load: true
    path: "tests/fixtures"

  coverage:
    minimum: 80
    exclude:
      - "*/migrations/*"
      - "*/tests/*"

# Environment-specific overrides
environments:
  development:
    debug: true
    server:
      reload: true
    logging:
      level: "DEBUG"

  production:
    debug: false
    server:
      reload: false
      workers: 8
    logging:
      level: "WARNING"
