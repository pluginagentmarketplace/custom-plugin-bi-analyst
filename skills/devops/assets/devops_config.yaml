# DevOps & Infrastructure Configuration Template
# BI Analyst Plugin - DevOps Skill
# Version: 1.0.0

project:
  name: "${PROJECT_NAME}"
  environment: "${ENVIRONMENT:-development}"

# Container Configuration
docker:
  registry: "${DOCKER_REGISTRY:-docker.io}"
  image_name: "${PROJECT_NAME}"
  tag: "${VERSION:-latest}"

  build:
    context: "."
    dockerfile: "Dockerfile"
    target: "production"
    args:
      - "PYTHON_VERSION=3.11"

  compose:
    version: "3.8"
    services:
      - app
      - db
      - redis
      - nginx

# Kubernetes Configuration
kubernetes:
  namespace: "${K8S_NAMESPACE:-default}"
  cluster: "${K8S_CLUSTER}"

  deployment:
    replicas: 3
    strategy:
      type: "RollingUpdate"
      maxSurge: 1
      maxUnavailable: 0

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: "${DOMAIN}"
        paths:
          - path: /
            pathType: Prefix

# CI/CD Pipeline
cicd:
  provider: "github-actions"  # github-actions, gitlab-ci, jenkins

  stages:
    - name: "lint"
      commands:
        - "ruff check ."
        - "mypy ."

    - name: "test"
      commands:
        - "pytest --cov=app tests/"
      coverage_threshold: 80

    - name: "build"
      commands:
        - "docker build -t ${IMAGE_NAME}:${TAG} ."

    - name: "deploy"
      environments:
        - staging
        - production
      approval_required:
        staging: false
        production: true

  secrets:
    - DOCKER_USERNAME
    - DOCKER_PASSWORD
    - KUBECONFIG
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

# Infrastructure as Code
infrastructure:
  provider: "terraform"  # terraform, pulumi, cloudformation

  terraform:
    backend:
      type: "s3"
      bucket: "${TF_STATE_BUCKET}"
      key: "${PROJECT_NAME}/terraform.tfstate"
      region: "${AWS_REGION:-us-east-1}"
      encrypt: true
      dynamodb_table: "${TF_LOCK_TABLE}"

    modules:
      - vpc
      - eks
      - rds
      - elasticache
      - s3

# Cloud Provider
cloud:
  provider: "aws"  # aws, gcp, azure

  aws:
    region: "${AWS_REGION:-us-east-1}"

    services:
      - eks
      - rds
      - elasticache
      - s3
      - cloudfront
      - route53
      - acm
      - secretsmanager

# Monitoring & Observability
monitoring:
  metrics:
    provider: "prometheus"
    scrape_interval: "15s"
    retention: "30d"

  logging:
    provider: "loki"
    retention: "14d"

  tracing:
    provider: "jaeger"
    sample_rate: 0.1

  alerting:
    provider: "alertmanager"
    channels:
      - slack
      - pagerduty
      - email

  dashboards:
    provider: "grafana"
    auto_provision: true

# Security
security:
  secrets_management:
    provider: "vault"  # vault, aws-secrets-manager, azure-keyvault
    path: "secret/${PROJECT_NAME}"

  network_policies:
    enabled: true
    default_deny_ingress: true
    default_deny_egress: false

  pod_security:
    run_as_non_root: true
    read_only_root_filesystem: true
    drop_capabilities:
      - ALL

  scanning:
    container_scan: true
    dependency_scan: true
    sast: true
    dast: false

# Backup & Disaster Recovery
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30

  targets:
    - type: "database"
      provider: "rds-snapshot"
    - type: "files"
      provider: "s3"
      bucket: "${BACKUP_BUCKET}"

  disaster_recovery:
    rpo_hours: 4
    rto_hours: 2
    multi_region: true
    failover_region: "us-west-2"
